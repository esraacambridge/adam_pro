<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adam Attia Games | متجر الألعاب الرقمية</title>
    <meta name="description" content="Adam Attia Games - وجهتك الأولى لشراء الألعاب الإلكترونية والمنتجات الرقمية. ألعاب PC, PlayStation, Xbox, Nintendo بأفضل الأسعار وتسليم فوري." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('aag-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.add('theme-' + t);
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
